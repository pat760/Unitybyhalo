<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automation Telemetry Dashboard – Customer Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <nav>
        <a href="customer-details.html" class="nav-step active">1. Customer Details</a>
        <a href="payment.html" class="nav-step">2. Payment</a>
        <a href="system-selection.html" class="nav-step">3. System Selection</a>
        <a href="system-setup.html" class="nav-step">4. System Set up</a>
        <a href="alerts-alarms.html" class="nav-step">5. Alerts &amp; Alarms</a>
        <a href="escalations.html" class="nav-step">6. Escalations</a>
        <a href="io-wiring.html" class="nav-step">7. IO / Wiring Diagrams</a>
    </nav>
</header>
<div class="content">
    <h1>Customer Details</h1>
    <p>Collect your customer’s contact information, business details and any notes relevant to the automation project.</p>
    <div class="form-container">
        <form action="payment.html" method="get">
            <div class="section-header">Contact Information</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="first-name">First Name*</label>
                    <input type="text" id="first-name" name="firstName" required>
                </div>
                <div class="form-group">
                    <label for="last-name">Last Name*</label>
                    <input type="text" id="last-name" name="lastName" required>
                </div>
                <div class="form-group">
                    <label for="company">Company/Organisation</label>
                    <input type="text" id="company" name="company">
                </div>
            </div>
            <div class="section-header">Address</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="address-line1">Address Line 1*</label>
                    <input type="text" id="address-line1" name="addressLine1" required>
                </div>
                <div class="form-group">
                    <label for="address-line2">Address Line 2</label>
                    <input type="text" id="address-line2" name="addressLine2">
                </div>
                <div class="form-group">
                    <label for="city">City/Suburb*</label>
                    <input type="text" id="city" name="city" required>
                </div>
                <div class="form-group">
                    <label for="region">Region/State*</label>
                    <input type="text" id="region" name="region" required>
                </div>
                <div class="form-group">
                    <label for="postal-code">Postal Code*</label>
                    <input type="text" id="postal-code" name="postalCode" required>
                </div>
                <div class="form-group">
                    <label for="country">Country*</label>
                    <input type="text" id="country" name="country" required>
                </div>
            </div>
            <div class="section-header">Communication</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="phone">Phone Number*</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address*</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label for="notes">Comments/Notes</label>
                    <textarea id="notes" name="notes" rows="4"></textarea>
                </div>
            </div>
            <div style="margin-top: 1.5rem; text-align: right;">
                <button type="submit" class="btn">Next: Payment</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
